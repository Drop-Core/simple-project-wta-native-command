<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Native Geolocation API Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc; color: #1e293b; padding: 20px; margin: 0;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            max-width: 400px; width: 100%; background: #fff; padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; margin-top: 0; font-size: 1.4rem; }
        .data-card {
            background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px;
            padding: 15px; margin-bottom: 20px; font-family: monospace; font-size: 13px;
        }
        .data-card span { font-weight: bold; color: #2563eb; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button {
            padding: 12px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer; color: white;
        }
        .btn-get { background-color: #3b82f6; }
        .btn-watch { background-color: #10b981; }
        .btn-stop { background-color: #ef4444; }
        
        #log-console {
            background: #0f172a; color: #10b981; padding: 12px; border-radius: 8px;
            font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; line-height: 1.4;
        }
        .log-err { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h2>Geolocation API Tester</h2>
    
    <div class="data-card">
        Lat: <span id="val-lat">0.0000000</span><br>
        Lng: <span id="val-lng">0.0000000</span><br>
        Acc: <span id="val-acc">0</span> meters<br>
        Spd: <span id="val-spd">0</span> m/s
    </div>

    <div class="btn-group">
        <button class="btn-get" onclick="triggerGeo('geolocation-get')">📍 Get Location Once</button>
        <button class="btn-watch" onclick="triggerGeo('geolocation-watch')">📡 Start Live Tracking</button>
        <button class="btn-stop" onclick="triggerGeo('geolocation-clear')">🛑 Stop Tracking</button>
    </div>

    <div id="log-console">Awaiting commands...</div>
</div>

<script>
    const logBox = document.getElementById('log-console');
    
    function logMsg(msg, isErr = false) {
        const time = new Date().toLocaleTimeString();
        const line = `<span class="${isErr ? 'log-err' : ''}">[${time}] ${msg}</span><br>`;
        logBox.innerHTML = line + logBox.innerHTML;
    }

    // 1. Send command to Native App
    function triggerGeo(actionType) {
        if (window.top && window.top.postMessage) {
            window.top.postMessage(JSON.stringify({ 
                action: actionType,
                highAccuracy: false, // Set to false to allow fast WiFi/Network detection indoors
                timeout: 30000,      // Allow up to 30 seconds to acquire location lock
                maximumAge: 0        // Request a fresh location, do not use cached data
            }), '*');
            logMsg(`> Triggered: ${actionType}`);
        }
    }

    // 2. Receive coordinates from Native App
    window.addEventListener('message', function (e) {
        try {
            const payload = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
            
            if (payload.event === 'geolocation_success') {
                logMsg(`&lt; Success (${payload.data.action}): Data received.`);
                
                // Update UI Coordinates
                document.getElementById('val-lat').innerText = payload.data.coords.latitude.toFixed(7);
                document.getElementById('val-lng').innerText = payload.data.coords.longitude.toFixed(7);
                document.getElementById('val-acc').innerText = payload.data.coords.accuracy.toFixed(1);
                document.getElementById('val-spd').innerText = (payload.data.coords.speed || 0).toFixed(2);
            } 
            else if (payload.event === 'geolocation_error') {
                let friendlyMessage = payload.data.message;
                
                // Handle device GPS disabled scenarios gracefully
                if (payload.data.code === 2 || payload.data.code === 3) {
                    friendlyMessage = "Location signal not found. Please ensure your device GPS/Location switch is turned ON.";
                    alert(friendlyMessage);
                }
                
                logMsg(`&lt; ERROR: ${friendlyMessage} (Code: ${payload.data.code})`, true);
            }
            else if (payload.event === 'geolocation_cleared') {
                logMsg(`&lt; ${payload.data.message}`);
            }
        } catch (err) {}
    });
</script>

</body>
</html>
