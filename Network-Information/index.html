<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Network API Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { text-align: center; margin-top: 0; color: #0f172a; }
        .network-status-card {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            background: #e2e8f0;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .status-online { background: #dcfce7; color: #166534; }
        .status-offline { background: #fee2e2; color: #991b1b; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #3b82f6;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:active { background-color: #2563eb; }
        
        #log-console {
            background: #1e293b;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            height: 180px;
            overflow-y: auto;
        }
        .log-sent { color: #93c5fd; }
        .log-recv { color: #fde047; }
        .log-alert { color: #f87171; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h2>Network API Tester</h2>
    
    <div id="status-card" class="network-status-card">
        Unknown Status
    </div>

    <button onclick="sendCommand({ action: 'network-check' })">
        Check Current Network
    </button>

    <h4>Event Log:</h4>
    <div id="log-console">Waiting for events or commands...</div>
</div>

<script>
    const logConsole = document.getElementById('log-console');
    const statusCard = document.getElementById('status-card');

    function updateUI(type, isOnline) {
        statusCard.textContent = isOnline ? `Online (${type})` : `Offline (${type})`;
        statusCard.className = `network-status-card ${isOnline ? 'status-online' : 'status-offline'}`;
    }

    function logMessage(text, type) {
        const time = new Date().toLocaleTimeString();
        let colorClass = 'log-recv';
        if (type === 'sent') colorClass = 'log-sent';
        if (type === 'alert') colorClass = 'log-alert';
        
        logConsole.innerHTML = `<span class="${colorClass}">[${time}] ${text}</span><br>` + logConsole.innerHTML;
    }

    function sendCommand(payload) {
        if (window.top && window.top.postMessage) {
            window.top.postMessage(JSON.stringify(payload), '*');
            logMessage(`> Sent: ${payload.action}`, 'sent');
        }
    }

    window.addEventListener('message', function (e) {
        try {
            const payload = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
            
            if (payload.event === 'network_status') {
                logMessage(`< Received: status is ${payload.data.type}`, 'recv');
                updateUI(payload.data.type, payload.data.type !== 'none');
            } 
            else if (payload.event === 'network_offline') {
                logMessage(`! ALERT: Device went OFFLINE`, 'alert');
                updateUI('none', false);
            } 
            else if (payload.event === 'network_online') {
                logMessage(`! ALERT: Device came ONLINE (${payload.data.type})`, 'alert');
                updateUI(payload.data.type, true);
            }
        } catch (err) {}
    });
</script>

</body>
</html>
